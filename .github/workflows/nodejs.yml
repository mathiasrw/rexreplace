name: CI-test

on:
    push:
        branches: [main]
    # Every PR, also one that is based on another PR
    pull_request:

jobs:
    build:
        runs-on: ubuntu-latest

        strategy:
            matrix:
                # From the lowest Node rr runs on (??= needs 15) to the newest release, as latest can be a prerelease
                node-version: [16.x, 18.x, 20.x, 22.x, 24.x, 26.x]

        steps:
            - uses: actions/checkout@v7
            - name: Use Node ${{ matrix.node-version }}
              uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node-version }}
            - uses: oven-sh/setup-bun@v2
            - run: yarn install
            - run: yarn test-ci
